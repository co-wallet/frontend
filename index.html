<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/wallet-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/wallet-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Keep this static: iOS can retain the style chosen when the PWA is installed. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <style>
      /* Available before the application bundle: WebKit can sample the page during parsing. */
      html {
        --app-status-bar-background: #1d4ed8;
        --app-page-background: #ffffff;
        color-scheme: light;
        background-color: var(--app-page-background);
      }
      html[data-theme="dark"] {
        --app-status-bar-background: #16213e;
        --app-page-background: #1a1a2e;
        color-scheme: dark;
      }
      body {
        background-color: var(--app-page-background);
      }
      #app-status-bar {
        display: none;
      }
      html.app-ios-standalone #app-status-bar {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        /* A nonzero strip also provides a fixed background when iOS owns the inset. */
        height: max(6px, env(safe-area-inset-top, 0px));
        background-color: var(--app-status-bar-background);
        z-index: 100000;
        pointer-events: none;
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        let mode = 'system';
        try {
          const saved = JSON.parse(localStorage.getItem('theme-preference'))?.state?.mode;
          if (['light', 'dark', 'system'].includes(saved)) mode = saved;
        } catch {
          // Unavailable or malformed storage must not prevent the system theme from applying.
        }
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#16213e' : '#1d4ed8';
        const ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
        root.classList.toggle('app-ios-standalone', !!(ios && standalone));
      })();
    </script>
    <title>co-wallet</title>
  </head>
  <body>
    <!-- A real fixed element is visible to WebKit's browser-chrome color sampling.
         Ionic reserves the inset in its first toolbar; this element adds no padding. -->
    <div id="app-status-bar" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
